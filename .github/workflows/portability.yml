name: M1 native portability

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Record native environment (Windows is not WSL)
        env:
          EXPECTED_OS: ${{ runner.os }}
        run: >-
          node -e "console.log({node:process.version,
          platform:process.platform,arch:process.arch,
          runner:process.env.EXPECTED_OS,wsl:!!process.env.WSL_DISTRO_NAME});
          if(process.env.EXPECTED_OS==='Windows' &&
          (process.platform!=='win32'||process.env.WSL_DISTRO_NAME))
          process.exit(1)"
      - run: git --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and full suite (including native snapshot integration)
        run: npm run check
      - name: Verify tests left the checkout untouched
        run: >-
          node -e "const cp=require('node:child_process');
          const status=cp.execFileSync('git',['status','--porcelain=v1'],
          {encoding:'utf8'}); if(status){console.error(status);process.exit(1)}"
